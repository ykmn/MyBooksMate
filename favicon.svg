<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Строгий круглый контур 1:1 -->
  <circle cx="50" cy="50" r="50" fill="#181825"/>
  
  <!-- === АБСТРАКТНАЯ БИБЛИОТЕКА (Книги) === -->
  <!-- Левая книга (слегка прозрачная для объема) -->
  <rect x="24" y="22" width="14" height="38" rx="3" 
        fill="#F9E2AF" opacity="0.65" 
        transform="rotate(-6 31 41)"/>
  
  <!-- Центральная книга (главный акцент библиотеки) -->
  <rect x="41" y="18" width="16" height="42" rx="3" 
        fill="#F9E2AF" 
        transform="rotate(0 49 39)"/>
  
  <!-- Правая книга -->
  <rect x="60" y="25" width="13" height="35" rx="3" 
        fill="#EAB76A" opacity="0.8" 
        transform="rotate(5 66 42)"/>

  <!-- Горизонтальная линия-полка (связывает книги воедино) -->
  <line x1="20" y1="60" x2="80" y2="60" 
        stroke="#F9E2AF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- === СКАЧАТЬ (Стрелка) === -->
  <!-- Стрелка начинается от полки и уходит вниз, 
       создавая контраст с теплыми книгами своим неоновым цветом -->
  <g fill="none" stroke="#A6E3A1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Вертикальная часть стрелки -->
    <line x1="50" y1="58" x2="50" y2="82"/>
    
    <!-- Конец стрелки (клинок) -->
    <polyline points="38,72 50,84 62,72"/>
  </g>
  
  <!-- Маленькая деталь: база стрелки (место откуда "выгружаются" данные) -->
  <line x1="38" y1="58" x2="62" y2="58" 
        stroke="#A6E3A1" stroke-width="5.5" stroke-linecap="round"/>
</svg>